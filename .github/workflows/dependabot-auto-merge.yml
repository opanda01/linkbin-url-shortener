name: Dependabot auto-merge

# CI / CD yeşil olduktan sonra yalnızca dependabot[bot] PR'larını birleştirir.
# Dışarıdan gelen (fork / contributor) PR'lara dokunmaz.

on:
  workflow_run:
    workflows: ["CI / CD"]
    types:
      - completed

jobs:
  merge:
    name: Merge Dependabot PR after CI
    runs-on: ubuntu-latest
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request'

    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Squash-merge open Dependabot PR for this commit
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { owner, repo } = context.repo;
            const sha = context.payload.workflow_run.head_sha;

            const { data: prs } =
              await github.rest.repos.listPullRequestsAssociatedWithCommit({
                owner,
                repo,
                commit_sha: sha,
              });

            const dependabotPr = prs.find(
              (pr) => pr.user?.login === 'dependabot[bot]' && pr.state === 'open'
            );

            if (!dependabotPr) {
              core.info('No open Dependabot PR linked to this CI run — skipping.');
              return;
            }

            core.info(`Merging Dependabot PR #${dependabotPr.number} (${dependabotPr.title})`);

            await github.rest.pulls.merge({
              owner,
              repo,
              pull_number: dependabotPr.number,
              merge_method: 'squash',
            });
