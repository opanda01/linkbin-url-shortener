name: Dependabot auto-merge

# Dependabot PR'ları: CI / CD başarılı + patch/minor → squash merge.

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    name: Merge Dependabot PR after CI
    if: |
      github.event.pull_request.user.login == 'app/dependabot' ||
      github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Log skipped major updates
        if: steps.metadata.outputs.update-type == 'version-update:semver-major'
        run: echo "Major semver update — manual review required."

      - name: Wait for CI / CD
        if: |
          steps.metadata.outputs.update-type == 'version-update:semver-patch' ||
          steps.metadata.outputs.update-type == 'version-update:semver-minor'
        uses: lewagon/wait-on-check-action@v1.11.0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          running-workflow-name: CI / CD
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          wait-interval: 30
          allowed-conclusions: success

      - name: Update branch and squash-merge
        if: |
          steps.metadata.outputs.update-type == 'version-update:semver-patch' ||
          steps.metadata.outputs.update-type == 'version-update:semver-minor'
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { owner, repo } = context.repo;
            const pull_number = context.payload.pull_request.number;

            try {
              await github.rest.pulls.updateBranch({ owner, repo, pull_number });
            } catch (e) {
              core.info(`updateBranch: ${e.message}`);
            }

            await github.rest.pulls.merge({
              owner,
              repo,
              pull_number,
              merge_method: 'squash',
            });
