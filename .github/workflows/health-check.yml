name: Health Check

on:
  schedule:
    # Her 6 saatte bir (UTC)
    - cron: "0 */6 * * *"
  workflow_dispatch:

jobs:
  production:
    name: Production endpoints
    runs-on: ubuntu-latest
    timeout-minutes: 5

    env:
      API_BASE_URL: ${{ vars.API_BASE_URL || 'https://linkbin-api.onrender.com' }}
      WEB_BASE_URL: ${{ vars.WEB_BASE_URL || 'https://linkbin-web.onrender.com' }}

    steps:
      - name: GET /health (API)
        run: |
          set -euo pipefail
          url="${API_BASE_URL%/}/health"
          echo "Checking $url"
          body=$(curl -fsS --retry 5 --retry-delay 15 --retry-all-errors --max-time 120 "$url")
          echo "$body" | grep -q '"ok"[[:space:]]*:[[:space:]]*true'

      - name: GET /ready (API + Redis)
        run: |
          set -euo pipefail
          url="${API_BASE_URL%/}/ready"
          echo "Checking $url"
          code=$(curl -sS -o /tmp/ready.json -w "%{http_code}" --retry 5 --retry-delay 15 --retry-all-errors --max-time 120 "$url")
          test "$code" = "200"
          grep -q '"ok"[[:space:]]*:[[:space:]]*true' /tmp/ready.json

      - name: GET / (web static site)
        run: |
          set -euo pipefail
          url="${WEB_BASE_URL%/}/"
          echo "Checking $url"
          curl -fsS --retry 3 --retry-delay 10 --max-time 120 "$url" | head -c 500 | grep -qi html
